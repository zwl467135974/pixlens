[package]
name = "pixlens"
version = "1.1.3"
description = "PixLens 图镜 — 免费轻快的本地看图软件"
authors = ["Wyler"]
edition = "2021"

[lib]
name = "pixlens_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25", default-features = false, features = [
    "jpeg",
    "png",
    "gif",
    "webp",
    "bmp",
    "ico",
    "tiff",
    "hdr",
] }
walkdir = "2"
notify = "8"
blake3 = "1"
parking_lot = "0.12"
num_cpus = "1"
percent-encoding = "2"
memmap2 = "0.5"
rayon = "1"
# 多页 TIFF：image crate 只解首帧，按 02 文档预案直接用 tiff crate（接口已隔离）
tiff = "0.11"
psd-codec = { path = "../crates/psd-codec" }
kamadak-exif = "0.5"
# 壁纸：前端导出 PNG 的 base64 传输解码
base64 = "0.22"
